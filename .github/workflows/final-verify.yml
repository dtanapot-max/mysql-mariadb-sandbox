name: Final Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Node regression + coverage + benchmark + long-run
        run: npm run verify:node
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser IndexedDB reload gate
        run: npm run test:browser
      - name: Final evidence audit
        run: npm run evidence:audit
      - name: Final status
        run: npm run final:status
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-verification-evidence
          path: |
            evidence/
            playwright-report/
            test-results/
