name: Node Regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:coverage
      - run: npm run evidence
      - run: npm run evidence:audit
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-evidence
          path: evidence/
