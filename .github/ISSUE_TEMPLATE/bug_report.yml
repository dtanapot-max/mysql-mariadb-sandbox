name: Bug report
description: Report reproducible sandbox behavior or a test/evidence mismatch
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include production secrets or sensitive datasets."
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal SQL/scenario and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / evidence
      description: Include error code, relevant evidence fields, and environment.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22 / Chrome version / OS"
